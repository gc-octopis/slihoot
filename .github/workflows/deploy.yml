name: Deploy

# Runs only after the CI workflow completes successfully on main, then SSHes to
# the GCE VM and rolls the stack forward (git pull + docker compose up).
#
# Required GitHub repo secrets:
#   DEPLOY_HOST     - VM public IP or hostname
#   DEPLOY_USER     - SSH user on the VM
#   DEPLOY_SSH_KEY  - private key (PEM) authorised for DEPLOY_USER
# Optional repo variable:
#   DEPLOY_DIR      - checkout path on the VM (default: /opt/slihoot)
#
# The VM is expected to have the repo checked out at DEPLOY_DIR with a populated
# .env (see scripts/startup.sh for first-time bootstrap).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_DIR
          script: |
            set -euo pipefail
            cd "${DEPLOY_DIR:-/opt/slihoot}"
            git pull --ff-only
            docker compose up -d --build
            docker image prune -f
            docker compose ps
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
